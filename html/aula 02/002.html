<!DOCTYPE html>
<html lang="pt-br">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Adicionar Filme</title>
</head>
<body>
      <a href="../aula 01/001.html">Voltar</a>
      <h1>Adicionar Filme</h1>
      <form action="/test" method="post">
            <label for="titulo">Título</label> <br>
            <input type="text" id="titulo" name="titulo" required><br><br>

            <label for="ano">Ano</label> <br>
            <input type="number" id="ano" name="ano" required><br><br>

            <label for="genero">Gênero</label> <br>
            <input type="text" id="genero" name="genero" required><br><br>

            <label for="poster">URL do Poster</label> <br>
            <input type="url" id="poster" name="poster" required><br><br>

            <label for="status">Status</label> <br>
            <select id="status" name="status">
                  <option value="assistido">Assistido</option>
                  <option value="assistindo">Assistindo</option>
                  <option value="quero_assistir">Quero Assistir</option>
            </select><br><br>

            <label for="nota">Nota (1 a 5)</label> <br>
            <input type="number" id="nota" name="nota" min="1" max="5" required><br><br>   

            <label for="comentario">Comentário</label> <br>
            <textarea id="comentario" name="comentario" rows="3"></textarea><br><br>

            <button type="submit">Salvar</button>
            <button type="reset">Cancelar</button>
            
      </form>
</body>
</html>
